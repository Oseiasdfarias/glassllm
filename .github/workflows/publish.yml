name: publish

# Publish a release when a glassllm-vX.Y.Z tag is pushed.
on:
  push:
    tags:
      - "glassllm-v*"

concurrency:
  group: publish-glassllm-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --frozen
      - run: uv run pytest -q

  check-version:
    name: Check tag against pyproject.toml
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Compare tag and package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#glassllm-v}"
          PROJECT_VERSION=$(uv version --short)
          echo "tag=$TAG_VERSION pyproject.toml=$PROJECT_VERSION"
          if [ "$TAG_VERSION" != "$PROJECT_VERSION" ]; then
            echo "::error::Tag glassllm-v$TAG_VERSION does not match pyproject.toml ($PROJECT_VERSION)."
            exit 1
          fi

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    needs: check-version
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - name: Validate package metadata and README rendering
        run: uvx twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish to PyPI (Trusted Publishing)
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: pypi
      url: https://pypi.org/project/glassllm/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
