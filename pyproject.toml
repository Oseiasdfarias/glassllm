[project]
name = "glassllm"
version = "0.1.0"
description = "A small Transformer written from scratch in NumPy, built to be looked at."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Oséias Dias de Farias" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]
keywords = ["llm", "transformer", "education", "numpy", "attention", "autograd"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/Oseiasdfarias/glassllm"
Issues = "https://github.com/Oseiasdfarias/glassllm/issues"

[project.scripts]
glassllm = "glassllm.cli:main"

[dependency-groups]
dev = ["pytest>=8", "torch>=2.2"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/glassllm"]

[tool.hatch.build.targets.sdist]
include = ["src/glassllm", "tests", "scripts", "README.md", "LICENSE", "pyproject.toml"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
